[package]
name = "claude-usage-monitor"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Desktop tray app that tracks context usage of every local Claude Code session"
repository = "https://github.com/dimasekaadinandra25/claude-context-tracking"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = "0.37.0"
notify-rust = "4.18.2"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tray-icon = "0.26.1"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
