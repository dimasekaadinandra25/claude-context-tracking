name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: claude-usage-monitor-${{ runner.os }}
          path: |
            target/release/claude-usage-monitor
            target/release/claude-usage-monitor.exe
          if-no-files-found: error

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\claude-usage-monitor.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: claude-usage-monitor-setup
          path: target/installer/claude-usage-monitor-setup-*.exe
          if-no-files-found: error
