name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: claude-usage-monitor-${{ runner.os }}
          path: |
            target/release/claude-usage-monitor
            target/release/claude-usage-monitor.exe
          if-no-files-found: error

      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $icon = Get-ChildItem target -Recurse -Filter app.ico | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "installer icon: $icon"
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $defines = @("/DAppVersion=$version")
          if ($icon) { $defines += "/DAppIcon=$icon" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @defines installer\claude-usage-monitor.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: claude-usage-monitor-setup
          path: target/installer/claude-usage-monitor-setup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp dist/claude-usage-monitor-setup/*.exe out/
          cp dist/claude-usage-monitor-Windows/claude-usage-monitor.exe out/claude-usage-monitor-windows.exe
          cp dist/claude-usage-monitor-macOS/claude-usage-monitor out/claude-usage-monitor-macos
          cp dist/claude-usage-monitor-Linux/claude-usage-monitor out/claude-usage-monitor-linux
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Claude Usage Monitor $GITHUB_REF_NAME" --generate-notes
